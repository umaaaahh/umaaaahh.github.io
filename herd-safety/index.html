<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Herd Safety — Melbourne</title>

  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="map-container" class="night">

  <!-- Map canvas -->
  <div id="map"></div>

  <!-- Wordmark -->
  <div id="wordmark">
    <h1>HERD</h1>
    <span>Safety Navigation — Melbourne</span>
  </div>

  <!-- Control panel -->
  <div id="panel">

    <div id="mode-label" class="mode-label night">NIGHT — Find the Herd</div>

    <button id="mode-toggle">☀ Day Mode</button>

    <div class="layer-section">
      <div class="layer-section-label">Layers</div>

      <div class="toggle-row">
        <span class="toggle-label">Pedestrian sensors</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-pedestrians" checked />
          <span class="toggle-track"></span>
        </label>
      </div>

      <div class="toggle-row">
        <span class="toggle-label">Street lighting</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-lighting" checked />
          <span class="toggle-track"></span>
        </label>
      </div>
    </div>

    <div id="status-bar">
      <span id="status-dot" class="status-dot loading"></span>
      <span id="status-label">Connecting...</span>
    </div>

  </div>

  <!-- Legend — updates dynamically via JS but seeded for night -->
  <div id="legend">
    <div class="legend-title">Legend</div>

    <!-- Night legend (default visible) -->
    <div id="legend-night">
      <div class="legend-item">
        <span class="legend-dot gold"></span> Active — high traffic
      </div>
      <div class="legend-item">
        <span class="legend-dot amber"></span> Moderate flow
      </div>
      <div class="legend-item">
        <span class="legend-dot loitering"></span> ⚠ Stationary group
      </div>
      <div class="legend-item">
        <span class="legend-dot dim"></span> Quiet zone
      </div>
      <div class="legend-item" style="margin-top:6px;">
        <span class="legend-dot light"></span> Street lighting
      </div>
    </div>

    <!-- Day legend (hidden by default) -->
    <div id="legend-day" style="display:none;">
      <div class="legend-item">
        <span class="legend-dot clear"></span> Clear — quiet street
      </div>
      <div class="legend-item">
        <span class="legend-dot moderate"></span> Moderate traffic
      </div>
      <div class="legend-item">
        <span class="legend-dot avoid"></span> Busy — avoid
      </div>
    </div>

  </div>

</div><!-- /#map-container -->

<!-- App scripts (order matters) -->
<script src="config.js"></script>
<script src="js/pedestrians.js"></script>
<script src="js/lighting.js"></script>
<script src="js/map.js"></script>

<script>
  // Swap legend on mode toggle
  document.getElementById('mode-toggle').addEventListener('click', () => {
    const isNight = document.getElementById('map-container').classList.contains('night');
    // After toggleMode() fires, map-container class will have changed
    // Use a small delay to read the updated class
    setTimeout(() => {
      const nowNight = document.getElementById('map-container').className.includes('night');
      document.getElementById('legend-night').style.display = nowNight ? '' : 'none';
      document.getElementById('legend-day').style.display  = nowNight ? 'none' : '';
    }, 50);
  });
</script>

</body>
</html>
