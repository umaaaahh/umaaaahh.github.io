<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FAF7F2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Excuse Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

  <!-- ── Splash ─────────────────────────────────────── -->
  <div id="view-splash" class="screen active">
    <svg class="leaf-deco" style="top:-20px;right:-20px;width:160px;" viewBox="0 0 120 160" fill="none">
      <path d="M60 10 C90 10 110 40 110 80 C110 120 90 150 60 150 C30 150 10 120 10 80 C10 40 30 10 60 10Z" fill="#A8B5A0"/>
      <line x1="60" y1="10" x2="60" y2="150" stroke="#FAF7F2" stroke-width="1.5"/>
    </svg>
    <div class="splash-icon">
      <svg width="22" height="22" viewBox="0 0 120 160" fill="none">
        <path d="M60 10 C90 10 110 40 110 80 C110 120 90 150 60 150 C30 150 10 120 10 80 C10 40 30 10 60 10Z" fill="var(--accent)" opacity="0.75"/>
      </svg>
    </div>
    <h1 class="splash-title">Excuse me,<br>do you have<br>a minute?</h1>
    <p class="splash-subtext">A walk &amp; listen experience<br>through the park.</p>
    <button id="btn-begin" class="btn-primary">Begin</button>
    <p class="splash-footer">Location &amp; camera may be requested</p>
  </div>


  <!-- ── Map ───────────────────────────────────────── -->
  <div id="view-map" class="screen">
    <div class="map-nav">
      <button id="btn-scan" class="btn-scan" aria-label="Scan QR code">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
          <path d="M14 14h3v3h-3zM17 17h3M17 20v-3M20 14v3M20 20h-3"/>
        </svg>
      </button>
      <button id="btn-x" class="btn-x" aria-label="End experience">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="map-container">
      <div class="map-image-slot" id="map-image-slot"></div>
    </div>
    <div id="parts-list" class="parts-list"></div>
  </div>


  <!-- ── Player (intro, stops, outro) ──────────────── -->
  <div id="view-player" class="screen">
    <nav class="player-nav">
      <button id="btn-back" class="btn-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Map
      </button>
      <span id="player-title" class="player-title"></span>
    </nav>

    <div id="lyrics-container" class="lyrics-container"></div>

    <div id="choice-buttons" class="choice-buttons" style="display:none">
      <button id="btn-yes" class="btn-choice btn-yes">Yes, of course</button>
      <button id="btn-no"  class="btn-choice btn-no">I'm sorry, I can't</button>
    </div>

    <div class="player-controls">
      <div class="progress-wrap">
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div class="progress-times">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>
      <div class="playback-row">
        <button id="btn-play" class="btn-play" aria-label="Play / Pause">
          <svg id="icon-play" width="26" height="26" viewBox="0 0 24 24" fill="#FAF7F2">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <svg id="icon-pause" width="26" height="26" viewBox="0 0 24 24" fill="#FAF7F2" style="display:none">
            <rect x="6" y="4" width="4" height="16" rx="1"/>
            <rect x="14" y="4" width="4" height="16" rx="1"/>
          </svg>
        </button>
      </div>
      <div id="skip-row" class="skip-row" style="display:none">
        <button id="btn-skip" class="btn-skip">Skip to question</button>
      </div>
    </div>
  </div>


  <!-- ── Closing ────────────────────────────────────── -->
  <div id="view-closing" class="screen">
    <svg class="leaf-deco" style="top:-20px;right:-20px;width:140px;opacity:0.07;" viewBox="0 0 120 160" fill="none">
      <path d="M60 10 C90 10 110 40 110 80 C110 120 90 150 60 150 C30 150 10 120 10 80 C10 40 30 10 60 10Z" fill="#A8B5A0"/>
    </svg>
    <p class="closing-text">Annie will keep<br>waiting for Ron.</p>
  </div>


  <!-- ── QR overlay ────────────────────────────────── -->
  <div id="qr-overlay" class="qr-overlay">
    <video id="qr-video" class="qr-video" playsinline muted></video>
    <div class="qr-viewfinder"></div>
    <p class="qr-hint">Point at a QR code</p>
    <button id="btn-qr-close" class="btn-qr-close" aria-label="Close scanner">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>


  <audio id="audio" preload="auto"></audio>

  <script src="script/data.js"></script>
  <script src="script/player.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>

    // ── DOM refs ──────────────────────────────────────
    const viewSplash    = document.getElementById('view-splash');
    const viewMap       = document.getElementById('view-map');
    const viewPlayer    = document.getElementById('view-player');
    const viewClosing   = document.getElementById('view-closing');
    const playerTitle   = document.getElementById('player-title');
    const choiceButtons = document.getElementById('choice-buttons');
    const skipRow       = document.getElementById('skip-row');
    const partsListEl   = document.getElementById('parts-list');

    const urlStop = parseInt(new URLSearchParams(location.search).get('stop'), 10) || null;

    // currentContext replaces the old mode + currentStopId + isIntroMode() system
    let currentContext = null;

    // ── Screen transitions ────────────────────────────
    function transitionTo(next) {
      const cur = document.querySelector('.screen.active');
      if (cur) cur.classList.add('leaving');
      setTimeout(() => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active', 'leaving'));
        next.classList.add('active');
      }, cur ? 380 : 0);
    }

    // ── Player UI helper ──────────────────────────────
    function setPlayerUI({ title = '', showChoice = false }) {
      playerTitle.textContent     = title;
      choiceButtons.style.display = showChoice ? 'flex' : 'none';
      skipRow.style.display       = showChoice ? 'none' : 'flex';
    }

    // ── Open functions ────────────────────────────────
    function openIntro(stopId = null) {
      currentContext = { phase: 'intro-speech', stopId };
      setPlayerUI({});
      loadTrack(INTRO.speech.audioSrc, INTRO.speech.script);
      transitionTo(viewPlayer);
      setTimeout(playTrack, 420);
    }

    function openStop(id) {
      const stop = STOPS.find(s => s.id === id);
      if (!stop) return;
      currentContext = { phase: 'stop', stopId: id };
      setPlayerUI({ title: stop.location });
      loadTrack(stop.audioSrc, stop.script);
      transitionTo(viewPlayer);
      setTimeout(playTrack, 420);
    }

    function openOutro() {
      currentContext = { phase: 'outro' };
      setPlayerUI({});
      loadTrack(OUTRO.audioSrc, OUTRO.script);
      transitionTo(viewPlayer);
      setTimeout(playTrack, 420);
    }

    // ── Audio ended routing ───────────────────────────
    audio.addEventListener('ended', () => {
      if (!currentContext) return;
      const { phase, stopId } = currentContext;

      if (phase === 'intro-speech') {
        setPlayerUI({ showChoice: true });

      } else if (phase === 'intro-yes') {
        if (stopId) openStop(stopId);
        else transitionTo(viewMap);

      } else if (phase === 'intro-no') {
        openOutro();

      } else if (phase === 'stop') {
        const stop = STOPS.find(s => s.id === stopId);
        const visited = JSON.parse(localStorage.getItem('visited') || '[]');
        if (!visited.includes(stopId)) {
          visited.push(stopId);
          localStorage.setItem('visited', JSON.stringify(visited));
          document.getElementById('pin-' + stopId)?.classList.add('visited');
        }
        if (stop?.onEnd === 'closing') openOutro();
        else transitionTo(viewMap);

      } else if (phase === 'outro') {
        transitionTo(viewClosing);
      }
    });

    // ── Button wiring ─────────────────────────────────
    document.getElementById('btn-begin').addEventListener('click', () => {
      sessionStorage.setItem('session', '1');
      startPermissions();
      transitionTo(viewMap);
      setTimeout(() => openIntro(urlStop), 450);
    });

    document.getElementById('btn-back').addEventListener('click', () => {
      audio.pause();
      stopTextMode();
      transitionTo(viewMap);
    });

    document.getElementById('btn-x').addEventListener('click', openOutro);

    document.getElementById('btn-yes').addEventListener('click', () => {
      const stopId = currentContext?.stopId;
      currentContext = { phase: 'intro-yes', stopId };
      setPlayerUI({});
      loadTrack(INTRO.yes.audioSrc, INTRO.yes.script);
      setTimeout(playTrack, 50);
    });

    document.getElementById('btn-no').addEventListener('click', () => {
      currentContext = { phase: 'intro-no' };
      setPlayerUI({});
      loadTrack(INTRO.no.audioSrc, INTRO.no.script);
      setTimeout(playTrack, 50);
    });

    document.getElementById('btn-skip').addEventListener('click', () => {
      audio.pause();
      stopTextMode();
      if (currentContext?.phase === 'intro-speech') {
        setPlayerUI({ showChoice: true });
      } else {
        audio.dispatchEvent(new Event('ended'));
      }
    });

    // ── Leaflet base map ──────────────────────────────
    // Royal Botanic Gardens Melbourne — bounds derived from RBG's own POI data.
    // SW is roughly Domain Road Gate / Southern Gate; NE is Bridge Gate / Lych Gate.
    // The SVG has a ~9.6° clockwise rotation baked in, so fine-tune OVERLAY_BOUNDS
    // if the illustration drifts off the real park edge.
    const PARK_CENTRE  = [-37.8301, 144.9825];
    const PARK_ZOOM    = 17;
    const OVERLAY_URL  = 'https://pub-4150616b72844a3b9af9a5aa28511c95.r2.dev/overlay-melbourne2.svg';
    const OVERLAY_BOUNDS = [
      [-37.83438, 144.9733], // SW — exact bounds from RBG's own app.js
      [-37.82487, 144.9854], // NE
    ];

    const leafletMap = L.map('map-image-slot', {
      zoomControl:        false,
      attributionControl: false,
      dragging:           false,  // keep page-scroll working on touch
      scrollWheelZoom:    false,
      touchZoom:          false,
      tap:                false,
      keyboard:           false,
    }).setView(PARK_CENTRE, PARK_ZOOM);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
    }).addTo(leafletMap);

    L.imageOverlay(OVERLAY_URL, OVERLAY_BOUNDS, {
      opacity:     0.88,
      interactive: false,
    }).addTo(leafletMap);

    // Reflow tiles when orientation changes or browser chrome resizes
    window.addEventListener('resize', () => leafletMap.invalidateSize());

    // ── Build map ─────────────────────────────────────
    (function buildMap() {
      const visited = JSON.parse(localStorage.getItem('visited') || '[]');

      const introCard = document.createElement('button');
      introCard.className = 'part-card';
      introCard.innerHTML = '<span class="part-card-loc">Intro</span><span class="part-card-arrow">→</span>';
      introCard.addEventListener('click', () => openIntro());
      partsListEl.appendChild(introCard);

      STOPS.forEach(stop => {
        // Place each stop as a real Leaflet marker at its lat/lng coordinates
        const isVisited = visited.includes(stop.id);
        const icon = L.divIcon({
          className: '',
          html: `<div id="pin-${stop.id}" class="map-pin${isVisited ? ' visited' : ''}" aria-label="${stop.location}">
            <svg width="28" height="40" viewBox="0 0 28 40" xmlns="http://www.w3.org/2000/svg">
              <path d="M14 0C6.27 0 0 6.27 0 14C0 24.5 14 40 14 40S28 24.5 28 14C28 6.27 21.73 0 14 0Z" fill="currentColor"/>
              <circle cx="14" cy="13" r="5" fill="white" opacity="0.5"/>
            </svg>
          </div>`,
          iconSize:   [28, 40],
          iconAnchor: [14, 40],   // anchor at the tip
        });
        L.marker([stop.lat, stop.lng], { icon })
          .addTo(leafletMap)
          .on('click', () => openStop(stop.id));

        const card = document.createElement('button');
        card.className = 'part-card';
        card.innerHTML = '<span class="part-card-loc">' + stop.location + '</span><span class="part-card-arrow">→</span>';
        card.addEventListener('click', () => openStop(stop.id));
        partsListEl.appendChild(card);
      });

      const gotta = document.createElement('button');
      gotta.className = 'part-card gotta-go';
      gotta.innerHTML = '<span>Gotta go? <em>End the experience</em></span>';
      gotta.addEventListener('click', openOutro);
      partsListEl.appendChild(gotta);
    })();

    // ── Permissions: GPS + NFC ────────────────────────
    let userMarker = null;

    function startPermissions() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(pos => {
          const latlng = [pos.coords.latitude, pos.coords.longitude];

          // Show / move the blue "you are here" dot on the Leaflet map
          if (!userMarker) {
            userMarker = L.marker(latlng, {
              icon: L.divIcon({
                className: '',
                html: '<div class="user-dot"></div>',
                iconSize:   [14, 14],
                iconAnchor: [7, 7],
              }),
              interactive: false,
              zIndexOffset: -100,
            }).addTo(leafletMap);
          } else {
            userMarker.setLatLng(latlng);
          }

          STOPS.forEach(stop => {
            if (!stop.lat) return;
            const dist = haversine(pos.coords, stop);
            if (dist > stop.radius * 3) {
              audio.src = GPS.outOfRange;
              audio.play().catch(() => {});
            } else if (dist < stop.radius && GPS.near[stop.id]) {
              audio.src = GPS.near[stop.id];
              audio.play().catch(() => {});
            }
          });
        }, null, { enableHighAccuracy: true, maximumAge: 5000 });
      }

      if ('NDEFReader' in window) {
        const reader = new NDEFReader();
        reader.scan().then(() => {
          reader.addEventListener('reading', ({ message }) => {
            for (const record of message.records) {
              if (record.recordType === 'url') {
                try {
                  const id = parseInt(new URL(new TextDecoder().decode(record.data)).searchParams.get('stop'), 10);
                  if (id && sessionStorage.getItem('session')) openStop(id);
                } catch {}
              }
            }
          });
        }).catch(() => {});
      }
    }

    // ── QR scanner ────────────────────────────────────
    let qrStream = null, qrAnimFrame = null;
    const qrDetector = ('BarcodeDetector' in window)
      ? new BarcodeDetector({ formats: ['qr_code'] })
      : null;

    document.getElementById('btn-scan').addEventListener('click', openQR);
    document.getElementById('btn-qr-close').addEventListener('click', closeQR);

    async function openQR() {
      if (!qrDetector) { alert('QR scanning requires Chrome on Android or Edge.'); return; }
      try {
        qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        const vid = document.getElementById('qr-video');
        vid.srcObject = qrStream;
        await vid.play();
        document.getElementById('qr-overlay').classList.add('open');
        scanFrame();
      } catch { alert('Camera access denied.'); }
    }

    function scanFrame() {
      const vid = document.getElementById('qr-video');
      qrAnimFrame = requestAnimationFrame(async () => {
        if (!qrStream) return;
        try {
          const codes = await qrDetector.detect(vid);
          for (const code of codes) {
            let stopId = null;
            try { stopId = parseInt(new URL(code.rawValue).searchParams.get('stop'), 10); }
            catch { stopId = parseInt(code.rawValue, 10); }
            if (stopId) { closeQR(); openStop(stopId); return; }
          }
        } catch {}
        scanFrame();
      });
    }

    function closeQR() {
      cancelAnimationFrame(qrAnimFrame);
      qrAnimFrame = null;
      if (qrStream) { qrStream.getTracks().forEach(t => t.stop()); qrStream = null; }
      document.getElementById('qr-video').srcObject = null;
      document.getElementById('qr-overlay').classList.remove('open');
    }

  </script>
</body>
</html>
