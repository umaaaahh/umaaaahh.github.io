<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excuse Me — QR Codes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg:     #FAF7F2;
      --ink:    #2C2C2C;
      --muted:  #888;
      --subtle: #C8BFB5;
      --accent: #D4A5A5;
      --border: rgba(0,0,0,0.10);
      --font:   'Atkinson Hyperlegible', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      font-family: var(--font);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      padding: 3rem 2rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .header-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      font-style: italic;
      line-height: 1.4;
      margin-bottom: 0.4rem;
    }

    .header-sub {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    /* Grid of 3 cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      max-width: 780px;
      margin: 0 auto;
    }

    .qr-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.75rem 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      break-inside: avoid;       /* keeps card together when printing */
    }

    .stop-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      text-align: center;
    }

    .stop-num {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--subtle);
    }

    .stop-name {
      font-size: 17px;
      font-weight: 700;
    }

    /* QR code container — qrcode.js injects a canvas or img here */
    .qr-wrap {
      border-radius: 12px;
      overflow: hidden;
      line-height: 0;           /* collapse whitespace around canvas */
    }

    .qr-url {
      font-size: 10px;
      color: var(--subtle);
      letter-spacing: 0.03em;
      text-align: center;
      word-break: break-all;
    }

    /* Print styles */
    @media print {
      body { padding: 1.5cm; background: #fff; }
      .grid { gap: 1cm; }
      .qr-card { border: 0.5pt solid #ccc; border-radius: 10pt; padding: 1cm; }
      .no-print { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-icon">
      <svg width="18" height="18" viewBox="0 0 120 160" fill="none">
        <path d="M60 10 C90 10 110 40 110 80 C110 120 90 150 60 150 C30 150 10 120 10 80 C10 40 30 10 60 10Z" fill="#D4A5A5" opacity="0.85"/>
      </svg>
    </div>
    <h1>Excuse me</h1>
    <p class="header-sub">Scan at each location to continue</p>
  </header>

  <div class="grid" id="grid"></div>

  <p class="no-print" style="text-align:center;margin-top:2.5rem;font-size:12px;color:var(--subtle);">
    File → Print (or ⌘P) to produce a print-ready sheet.
  </p>

  <script>
    const BASE = 'https://umaaaahh.github.io/excuse-me/';

    const stops = [
      { stop: 1, name: 'The Gazebo'    },
      { stop: 2, name: 'The Lawn'      },
      { stop: 3, name: 'The Lake Bench'},
    ];

    const grid = document.getElementById('grid');

    stops.forEach(({ stop, name }) => {
      const url = BASE + '?stop=' + stop;

      const card = document.createElement('div');
      card.className = 'qr-card';

      const label = document.createElement('div');
      label.className = 'stop-label';
      label.innerHTML = `
        <span class="stop-num">Stop ${stop}</span>
        <span class="stop-name">${name}</span>`;

      const wrap = document.createElement('div');
      wrap.className = 'qr-wrap';

      const urlEl = document.createElement('p');
      urlEl.className = 'qr-url';
      urlEl.textContent = url;

      card.appendChild(label);
      card.appendChild(wrap);
      card.appendChild(urlEl);
      grid.appendChild(card);

      new QRCode(wrap, {
        text:        url,
        width:       200,
        height:      200,
        colorDark:   '#2C2C2C',
        colorLight:  '#FFFFFF',
        correctLevel: QRCode.CorrectLevel.H,  // high error correction — survives weathering
      });
    });
  </script>

</body>
</html>
