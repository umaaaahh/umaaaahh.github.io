<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Overthinker's Typing Pad</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="window">
    <div class="header-bar">
      <span class="title">Notepad - Untitled</span>
      <div class="window-buttons">
        <button>X</button>
      </div>
    </div>
    
    <div id="prompt-container">
        <p id="prompt">Prompt: Write 3 things you want to focus on in your life right now.</p>
    </div>

    <div id="typing-area" contenteditable="true" spellcheck="false">
    </div>

    <div id="chaos-meter">
      <div id="chaos-bar"></div>
      <span id="chaos-label">CHAOS: 0</span>
    </div>
    
  </div>

  <video id="static-overlay" src="media/static-glitch.mp4" muted loop></video>

  <script src="script.js"></script>
</body>
</html>
