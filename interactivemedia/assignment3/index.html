<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Annabel Lee</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="transition-mask"></div>
  
  <!-- Landing Page -->
  <section class="landing" id="landing">
    <h1>Annabel Lee</h1>
    <p>a poem by Edgar Allan Poe</p>
  </section>

  <!-- Scene 1 -->
  <section class="scene" id="scene1">
    <div class="scene-content">
      <img src="assets/scene1-background.png" class="background" />
      <img src="assets/scene1-moon.png" class="moon" />
      <img src="assets/scene1-girl.png" class="layer girl hidden" />
    </div>
    <div class="poem-text">
      <p>It was many and many a year ago,<br>In a kingdom by the sea...</p>
    </div>
  </section>


    <script src="script.js"></script>

</body>
</html>
