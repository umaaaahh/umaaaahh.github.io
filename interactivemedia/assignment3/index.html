<!DOCTYPE html><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Annabel Lee</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="vertical-scroll-container">
    <!-- LANDING PAGE -->
    <section id="landing" class="landing">
      <div class="landing-overlay"></div>
      <h1>Annabel Lee</h1>
      <p>A poem by Edgar Allan Poe</p>
    </section>

    <!-- HORIZONTAL SCENE TRACK -->
    <div class="horizontal-scroll">
      <!-- SCENE 1 -->
      <section class="scene">
        <div class="stage">
          <div class="fixed-background scene1-bg"></div>
          <img src="assets/moon.png" class="moon" />
          <img src="assets/girl.png" class="girl" style="opacity: 0;" />
          <div class="poem-text" id="poem-text"></div>
        </div>

        <div class="vertical-scroll">
          <section class="trigger" data-stanza="title"></section>
          <section class="trigger" data-stanza="1"></section>
          <section class="trigger" data-stanza="2"></section>
          <section class="trigger" data-stanza="3"></section>
        </div>
      </section>

      <!-- SCENE 2... -->
    </div>
  </main>


  <script src="script.js"></script>
</body>
</html>
