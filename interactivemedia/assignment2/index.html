<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Bag is the Map</title>
  <link rel="stylesheet" href="style.css" />
  
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Floating Cloud Buttons with Images -->
  <img src="cloud-materials-2.png" alt="Materials" class="cloud cloud-materials" />
  <a href="https://www.etsy.com/shop/crochetdaniela/?etsrc=sdt" target="_blank">
    <img src="cloud-shop-3.png" alt="Shop" class="cloud cloud-shop" />
  </a>  
  <a href="../landingpage/index.html">
    <img src="cloud-home-1.png" class="cloud cloud-home" alt="Back to Home">
  </a>
  
<!-- Landing Page -->
  <section id="landing-page">
    <div class="text-area">
      <h1>THE BAG IS THE MAP</h1>
      <p>CLICK A PART. LEARN THE CRAFT.</p>
    </div>
    <img src="Brown Bag.png" alt="Brown Bag" id="clickable-bag" class="landing-bag" />
  </section>

<!-- Bag Map Page -->
  <section id="bag-map" class="hidden">
    <div class="bag-map-wrapper">
      <img src="green bag.png" alt="Green Bag" class="map-bag" />

<!-- DOTS -->

      <!-- Materials (Video)-->
      <div class="dot tutorial-dot"
        data-step="1"  
        style="top: 16%; left: 29%;" 
        data-title="[START HERE] Materials"
        data-src=" https://ia601502.us.archive.org/11/items/crochet-handbag-tutorial-materials/CROCHET%20HANDBAG%20TUTORIAL%20-%20materials.mp4">
      </div>

      <!-- 1. Body (Dot Group) -->
      <div class="dot tutorial-dot dot-grouped"
        id="dot-body-group"
        data-step="2"
        style="top: 55%; left: 45%;"
        data-title="1.Body">
      </div>

      <!-- 2. Handle (Dot Group) -->
      <div class="dot tutorial-dot dot-grouped"
        id="dot-handle-group"
        data-step="3"
        style="top: 50%; left: 90%;"
        data-title="2.Handle">
      </div>

<!-- SUB DOTS -->

      <!-- Body: Sub-dots(hidden initially) -->

        <!-- 1.1 Starting the bag (Video) --> 
        <div class="sub-dot body-sub-dot tutorial-dot hidden" 
          data-step="2.1"
          style="top: 85%; left: 75%;"
          data-title="1.1 Start the Bag Body"
          data-src="https://ia601206.us.archive.org/16/items/crochet-handbag-tutorial-starting-the-bag/CROCHET%20HANDBAG%20TUTORIAL%20-%20Starting%20the%20bag.ia.mp4">
        </div>

        <!-- 1.2 Body of the bag (Video)  --> 
          <div class="sub-dot body-sub-dot tutorial-dot hidden" 
          data-step="2.2"
          style="top: 65%; left: 65%;"
          data-title="1.2 Making the Bag Body"
          data-src="https://ia601609.us.archive.org/33/items/crochet-handbag-tutorial-making-the-body/CROCHET%20HANDBAG%20TUTORIAL-%20making%20the%20body.ia.mp4">
        </div>

        <!-- 1.3 Finishing the body (Video) --> 
          <div class="sub-dot body-sub-dot tutorial-dot hidden" 
          data-step="2.3"
          style="top: 50%; left: 85%;"
          data-title="1.3 Finishing the Bag Body"
          data-src="https://ia601502.us.archive.org/18/items/crochet-handbag-tutorial-finishing-the-body/CROCHET%20HANDBAG%20TUTORIAl-%20Finishing%20the%20body.ia.mp4">
       </div>

        <!-- 1.4 Clasp [Bonus] (Video) --> 
          <div class="sub-dot body-sub-dot tutorial-dot hidden" 
          data-step="2.4"
          style="top: 45%; left: 54%;"
          data-title="1.4 Clasp [Bonus]"
          data-src="https://ia601300.us.archive.org/32/items/crochet-handbag-tutorial-bonus-clasp/CROCHET%20HANDBAG%20TUTORIAL%20-%20Bonus%20Clasp.mp4">
        </div>


      <!--  handle: Sub-dots (hidden initially) -->

        <!-- 2.1  Begin the Handle (Video) --> 
        <div class="sub-dot handle-sub-dot tutorial-dot hidden"
          data-step="3.1"
          style="top: 35%; left: 91%;"
          data-title="2.1 Begin the Handle"
          data-src="https://ia801300.us.archive.org/35/items/crochet-handbag-tutorial-starting-the-strap/CROCHET%20HANDBAG%20TUTORIAL%20-%20starting%20the%20strap.ia.mp4?cnt=0">
        </div>

        <!-- 2.2 The Handle (Video) --> 
        <div class="sub-dot handle-sub-dot tutorial-dot hidden"
          data-step="3.2"
          style="top: 13%; left: 72%;"
          data-title="2.2 The Handle"
          data-src="https://ia601702.us.archive.org/0/items/crochet-handbag-tutorial-making-the-strap/CROCHET%20HANDBAG%20TUTORIAL%20-%20Making%20the%20strap.ia.mp4?cnt=0">
        </div>

        <!-- 2.3 Finishing the Handle (Video) --> 
        <div class="sub-dot handle-sub-dot tutorial-dot hidden"
          data-step="3.3"
          style="top: 11%; left: 44%;"
          data-title="2.3 Finishing the Handle"
          data-src="">
        </div>

        <!-- 2.4 The Bow [FINAL] (Video) --> 
        <div class="sub-dot handle-sub-dot tutorial-dot hidden"
         data-step="3.4"
         style="top: 16%; left: 29%;" 
         data-title="2.4The Bow [FINAL]"
         data-src="https://ia800708.us.archive.org/26/items/crochet-handbag-tutorial-the-bow-ending/CROCHET%20HANDBAG%20TUTORIAL%20-%20The%20Bow%20%28ending%29.ia.mp4?cnt=0">
       </div>
    </div>
  </section>
  

<!-- Video Player Panel -->
<div id="video-player" class="video-panel hidden">
  <div class="video-header">
    <h2 id="video-title">Tutorial Title</h2>
    <button id="close-video">✖</button>
  </div>

  <video id="tutorial-video"></video>

  <div class="custom-controls">
    <button id="custom-play">▶️</button>
    <div class="audio-wrapper">
      <button id="audio-toggle">🔊</button>
      <input type="range" id="custom-volume" min="0" max="1" step="0.01" value="1" class="hidden" />
    </div>
    <div id="custom-progress" class="progress-bar">
      <div id="custom-progress-filled" class="progress-filled"></div>
    </div>
    <div id="custom-timestamp" class="timestamp">00:00 / 00:00</div>
  </div>
</div>

    <!-- Video Navigation Panel -->
    <div id="video-nav-panel" class="video-nav-panel hidden">
      <div class="video-header">
        <h3 class="nav-title">Steps</h3>
        <button id="close-nav-panel" class="close-btn">✖</button>
      </div>
      <div class="video-nav-buttons">
        <button data-step="1"> Materials</button>
        <button data-step="2.1">1.1 Start</button>
        <button data-step="2.2">1.2 Body</button>
        <button data-step="2.3">1.3 Finish</button>
        <button data-step="2.4">1.4 Clasp</button>
        <button data-step="3.1">2.1 Strap Start</button>
        <button data-step="3.2">2.2 Strap</button>
        <button data-step="3.3">2.3 End Strap</button>
        <button data-step="3.4">2.4 Bow</button>
      </div>
    </div> 

    <!-- Materials Panel  -->
    <div id="materials-overlay" class="overlay hidden">
      <div class="overlay-content">
        <button id="close-materials" class="close-btn">✖</button>
        <h2>🧶 Materials Needed</h2>
        <ul>
          <li>T-shirt Yarn (300g)</li>
          <li>Crochet Hook (7mm)</li>
          <li>Scissors</li>
          <li>Stitch Marker</li>
          <li>Thick Ribbon (80cm)</li>
          <li>Sew In Clasp (Optional)</li>
        </ul>
      </div>
    </div>

  <script src="script.js" defer></script>
</body>
</html>
