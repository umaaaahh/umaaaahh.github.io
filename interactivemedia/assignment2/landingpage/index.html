<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Bag is the Map</title>
  <link rel="stylesheet" href="style.css" />
  
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Floating Cloud Buttons with Images -->
  <img src="cloud-materials-2.png" alt="Materials" class="cloud cloud-materials" />
  <a href="https://www.etsy.com/shop/crochetdaniela/?etsrc=sdt" target="_blank">
    <img src="cloud-shop-3.png" alt="Shop" class="cloud cloud-shop" />
  </a>  
  <a href="../landingpage/index.html">
    <img src="cloud-home-1.png" class="cloud cloud-home" alt="Back to Home">
  </a>
  
  <!-- Landing Page -->
  <section id="landing-page">
    <div class="text-area">
      <h1>THE BAG IS THE MAP</h1>
      <p>CLICK A PART. LEARN THE CRAFT.</p>
    </div>
    <img src="Brown Bag.png" alt="Brown Bag" id="clickable-bag" class="landing-bag" />
  </section>

  <!-- Bag Map Page -->
  <section id="bag-map" class="hidden">
    <div class="bag-map-wrapper">
      <img src="green bag.png" alt="Green Bag" class="map-bag" />

      <!-- Video: [Start Here] Materials -->
       <div class="dot" 
          style="top: 18%; left: 28%;" 
          data-title="[START HERE] Materials"
          data-src=" https://ia601502.us.archive.org/11/items/crochet-handbag-tutorial-materials/CROCHET%20HANDBAG%20TUTORIAL%20-%20materials.mp4">
        </div>

      <!-- Dot Group: Body -->
      <div class="dot dot-grouped"
        id="dot-body-group"
        style="top: 55%; left: 45%;"
        data-title="1.Body">
      </div>

      <!-- Dot Group: Handle -->
      <div class="dot dot-grouped"
        id="dot-handle-group"
        style="top: 50%; left: 90%;"
        data-title="2.Handle">
      </div>

      <!-- Body Dot: Sub-dots(hidden initially) -->

        <!-- Video: Step 1: Starting the bag --> 
        <div class="sub-dot body-sub-dot hidden" 
          style="top: 90%; left: 75%;"
          data-title="Step 1: Start the Bag Body"
          data-src="https://archive.org/download/your-video-name/your-video-name.mp4">
        </div>

        <!-- Video: Step 2: Body of the bag --> 
          <div class="sub-dot body-sub-dot hidden" 
          style="top: 50%; left: 75%;"
          data-title="Step 2: Making the Bag Body"
          data-src="https://archive.org/download/your-video-name/your-video-name.mp4">
        </div>

        <!-- Video: Step 3: Body of the bag --> 
          <div class="sub-dot body-sub-dot hidden" 
          style="top: 65%; left: 46%;"
          data-title="Step 3: Finishing the Bag Body"
          data-src="https://ia801502.us.archive.org/18/items/crochet-handbag-tutorial-finishing-the-body/CROCHET%20HANDBAG%20TUTORIAl-%20Finishing%20the%20body.mp4">
       </div>

        <!-- Video: Step 4: Clasp [Bonus] --> 
          <div class="sub-dot body-sub-dot hidden" 
          style="top: 45%; left: 54%;"
          data-title="Step 4: Clasp [Bonus]"
          data-src="https://ia601300.us.archive.org/32/items/crochet-handbag-tutorial-bonus-clasp/CROCHET%20HANDBAG%20TUTORIAL%20-%20Bonus%20Clasp.mp4">
        </div>


      <!--  handle Dot: Sub-dots (hidden initially) -->

        <!-- Video: Step 5: Begin the Handle --> 
        <div class="sub-dot handle-sub-dot hidden"
          style="top: 45%; left: 54%;"
          data-title="Step 5: Begin the Handle"
          data-src="https://ia601300.us.archive.org/32/items/crochet-handbag-tutorial-bonus-clasp/CROCHET%20HANDBAG%20TUTORIAL%20-%20Bonus%20Clasp.mp4">
        </div>

        <!-- Video: Step 6: The Handle --> 
        <div class="sub-dot handle-sub-dot hidden"
          style="top: 25%; left: 55%;"
          data-title="Step 6: The Handle"
          data-src="video-handle-secure.mp4">
        </div>

        <!-- Video: Step 7: Finishing the Handle --> 
        <div class="sub-dot handle-sub-dot hidden"
          style="top: 75%; left: 55%;"
          data-title="Step 7: Finishing the Handle"
          data-src="video-handle-secure.mp4">
        </div>

        <!-- Video: Step 8: The Bow [FINAL] --> 
        <div class="sub-dot handle-sub-dot hidden"
         style="top: 75%; left: 35%;"
         data-title="Step 8: The Bow [FINAL]"
         data-src="video-handle-secure.mp4">
       </div>
    </div>
  </section>
  

  <!-- Custom Video Player Panel -->
    <div id="video-player" class="video-panel hidden">
        <div class="video-header">
        <h2 id="video-title">Tutorial Title</h2>
        <button id="close-video">✖</button>
        </div>
        <video id="tutorial-video" controls>
        Your browser does not support the video tag.
        </video>
    </div>

    <!-- Materials Panel  -->
    <div id="materials-overlay" class="overlay hidden">
      <div class="overlay-content">
        <button id="close-materials" class="close-btn">✖</button>
        <h2>🧶 Materials Needed</h2>
        <ul>
          <li>Yarn (3mm - cotton)</li>
          <li>Crochet Hook (3.5mm)</li>
          <li>Scissors</li>
          <li>Stitch Marker (optional)</li>
          <li>Clasp or Button for closure</li>
        </ul>
      </div>
    </div>
    
   <!-- Floating Text -->
   <div id="cursor-follow-text" class="cursor-float">
    [click the bag to begin]
  </div>
  
      
      
  <script src="script.js" defer></script>
</body>
</html>
