<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Overthinker's Notepad</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="window">
    <div class="header-bar">
      <span class="title">The Overthinker's Notepad</span>
      <div class="window-buttons">
        <button>X</button>
      </div>
    </div>
    
    <div id="prompt-container">
        <p id="prompt">Prompt: Write 3 things you want to focus on in your life right now.</p>
    </div>

    <div id="typing-area" contenteditable="true" spellcheck="false">
    </div>

    <div id="chaos-meter">
      <div id="chaos-bar"></div>
      <span id="chaos-label">CHAOS: 0</span>
    </div>
    
  </div>

  <!-- <video id="static-overlay" src="media/static-glitch.mp4" muted loop></video> -->
  <video id="static-overlay" src="https://cdn.pixabay.com/video/2020/12/01/58013-486853042_large.mp4" muted></video>
  <audio id="type-sound" src="media/type.wav" preload="auto"></audio>
  <audio id="meltdown-sound" src="media/meltdown.mp3" preload="auto" loop></audio>
  <audio id="static-sound" src="media/static.mp3" preload="auto" loop></audio>


  <script src="script.js"></script>
</body>
</html>
